<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
</helmet>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex; flex-direction:column; font-family:'Inter', system-ui, sans-serif; font-size:13px; color:var(--text);">
    <div style="display:flex; align-items:center; height:48px; padding:0 14px; gap:8px; border-bottom:1px solid var(--line);">
      <span style="width:22px; display:flex; flex-direction:column; gap:4px;"><span style="height:1.5px; background:var(--text);"></span><span style="height:1.5px; background:var(--text);"></span><span style="height:1.5px; background:var(--text);"></span></span>
      <div style="display:flex; align-items:center; gap:7px; font-weight:600; font-size:14px; margin-left:4px;"><span style="width:14px; height:14px; background:var(--text); border-radius:4px;"></span>RankWagers</div>
      <span style="margin-left:auto; width:30px; height:30px; display:grid; place-items:center; border:1px solid var(--line); border-radius:6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>
      <span style="height:30px; display:flex; align-items:center; padding:0 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-weight:500;">TR</span>
      <span style="font-size:10px; font-weight:600; border:1px solid var(--line); padding:1px 4px; border-radius:4px; color:var(--muted);">18+</span>
    </div>
    <div style="display:flex; gap:16px; padding:0 14px; font-size:12px; font-weight:500; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden;">
      <span style="padding:9px 0; border-bottom:2px solid {{ b0 }}; color:{{ c0 }};">Tahminler</span><span style="padding:9px 0; border-bottom:2px solid {{ b1 }}; color:{{ c1 }};">Bahis İpuçları</span><span style="padding:9px 0; border-bottom:2px solid {{ b2 }}; color:{{ c2 }};">Bahis Siteleri</span><span style="padding:9px 0; border-bottom:2px solid {{ b3 }}; color:{{ c3 }};">Bedava Bahis</span>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex; align-items:center; height:52px; padding:0 20px; gap:22px; border-bottom:1px solid var(--line); font-family:'Inter', system-ui, sans-serif; font-size:13px; color:var(--text);">
    <div style="display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px;"><span style="width:16px; height:16px; background:var(--text); border-radius:4px;"></span>RankWagers</div>
    <div style="display:flex; gap:18px; font-weight:500; font-size:13px;">
      <span style="padding:17px 0; border-bottom:2px solid {{ b0 }}; color:{{ c0 }};">Tahminler</span><span style="padding:17px 0; border-bottom:2px solid {{ b1 }}; color:{{ c1 }};">Bahis İpuçları</span><span style="padding:17px 0; border-bottom:2px solid {{ b2 }}; color:{{ c2 }};">Bahis Siteleri</span><span style="padding:17px 0; border-bottom:2px solid {{ b3 }}; color:{{ c3 }};">Bedava Bahis</span>
    </div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      <span style="display:flex; align-items:center; gap:8px; width:240px; height:32px; padding:0 10px; border:1px solid var(--line); border-radius:6px; color:var(--muted); font-size:12px; background:var(--surface);"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Takım, lig veya market</span>
      <span style="height:32px; display:flex; align-items:center; gap:6px; padding:0 10px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-weight:500;">TR ▾</span>
      <span style="font-size:11px; font-weight:600; border:1px solid var(--line); padding:2px 5px; border-radius:4px; color:var(--muted);">18+</span>
      <span style="height:32px; display:flex; align-items:center; padding:0 12px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-weight:500;">Giriş</span>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 0, m = this.props.mobile ?? false, o = {};
    for (let i = 0; i < 4; i++) { o['b' + i] = i === a ? 'var(--text)' : 'transparent'; o['c' + i] = i === a ? 'var(--text)' : 'var(--muted)'; }
    return { ...o, isMobile: m, isDesktop: !m };
  }
}
</script>
</body>
</html>
