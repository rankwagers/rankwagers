# RankWagers — /admin sadece belirtilen istemci IP (Cloudflare arkasında)
#
# Kurulum:
# 1) Bu dosyadaki `map` bloğunu /etc/nginx/nginx.conf içinde `http { }` bloğuna
#    (server bloklarından ÖNCE, bir kez) ekleyin.
# 2) `location ^~ /admin` bloğunu rankwagers.com server { } içine,
#    genel `location / { proxy_pass ... }` bloğundan ÖNCE ekleyin.
# 3) sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare proxy açıkken gerçek IP CF-Connecting-IP header'ındadır.
# Doğrudan origin'e gelen isteklerde header boş kalır → 403 (kasıtlı).

map $http_cf_connecting_ip $rw_admin_allowed {
    default 0;
    212.162.152.36 1;
}

# server { ... server_name rankwagers.com; ... } içine yapıştırın:

location ^~ /admin {
    if ($rw_admin_allowed = 0) {
        return 403;
    }

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
}
